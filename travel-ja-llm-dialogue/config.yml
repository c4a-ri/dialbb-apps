# configuration file for an LLM-based Japanese application

blocks:
  - name: llm_dialogue
    block_class: dialbb.builtin_blocks.llm_dialogue.LLMDialogue
    input:
      dialogue_history: dialogue_history
      aux_data: aux_data
    output:
      system_utterance: system_utterance
      aux_data: aux_data
      final: final
    user_name: ユーザ
    system_name: システム
    first_system_utterance: "こんにちは。私の名前は渡辺翔太です。本日は旅行に関してインタビューさせてください。旅行には良く行かれますか？"
    prompt_template: prompt_template.txt
    model: gpt-5.4-nano
    temperature: 0.7
    # multi_party: False
    
    

